<!doctype html>
<!-- Test page: the Tom Ford on its own, large, as a product shot (front, 3/4, side, top). For comparing with photos of the
     real frame. ?view=front|q|side|top|hinge  &tilt= &arm= &open= (degrees, defaults: typical fit on Paul) -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#f4f4f2}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { studioEnv } from './env.js?v=22';
import { buildTomFord } from './tomford.js?v=22';
const Q = new URLSearchParams(location.search), W = +(Q.get('w') || 1400), H = +(Q.get('h') || 900);
const renderer = new THREE.WebGLRenderer({ antialias: true, stencil: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf4f4f2); scene.environment = studioEnv(renderer);
scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 1.2)); const d = new THREE.DirectionalLight(0xffffff, 1.5); d.position.set(80, 200, 300); scene.add(d);
const g = buildTomFord(); scene.add(g.root);
const deg = Math.PI / 180, tilt = +(Q.get('tilt') ?? 18) * deg, armDown = +(Q.get('arm') ?? -4) * deg, open = +(Q.get('open') ?? 9) * deg;
g.root.rotation.set(tilt, 0, 0);
g.temples.L.rotation.set(-(armDown + tilt), open, 0); g.temples.R.rotation.set(-(armDown + tilt), -open, 0);
if (g.setArmEnd) g.setArmEnd(200);
g.root.traverse(o => { if (o.material && o.material.colorWrite === false) o.visible = false; });   // no invisible helpers
const views = { front: [0, 0, 420], q: [260, 40, 330], side: [420, 10, -40], top: [0, 420, -20], hinge: [150, 30, 70], ridge: [95, 70, 40], back: [120, 60, -380] };
const v = views[Q.get('view') || 'front'], cam = new THREE.PerspectiveCamera(Q.get('view') === 'hinge' ? 22 : Q.get('view') === 'ridge' ? 16 : 30, W / H, 1, 3000);
cam.position.set(...v); const tgt = Q.get('view') === 'ridge' ? [60, 20, -8] : Q.get('view') === 'hinge' ? [68, 14, -15] : Q.get('view') === 'side' || Q.get('view') === 'top' ? [0, 5, -50] : [0, 5, -20];
cam.lookAt(...tgt); renderer.render(scene, cam); window.done = true;
</script></body></html>
